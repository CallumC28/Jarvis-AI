[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-agent-sk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "semantic-kernel>=1.0.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "openai>=1.0.0",
  "numpy>=1.26.0",
  "mss>=9.0.1",        # screenshot + pc plugins are always registered
  "pillow>=10.0.0",
  "pywin32>=306; sys_platform == 'win32'",
  "pycaw>=20240210; sys_platform == 'win32'",   # master volume for pc.set_volume
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]
desktop = [
  "PySide6>=6.7.0",
]
voice = [
  "faster-whisper>=1.0.0",
  "openwakeword>=0.6.0",
  "kokoro-onnx>=0.4.0",
  "sounddevice>=0.4.6",
]
gpu = [
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
home-agent = "home_agent.main:run"

[project.gui-scripts]
home-agent-desktop = "home_agent.ui.desktop_app:run_desktop"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["^data/"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
